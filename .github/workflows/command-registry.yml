name: Command Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate command registry
        run: |
          python - <<'PY'
          from web.command_registry import discover_commands
          commands = discover_commands()
          assert commands, "No slash commands discovered"
          names = [command["name"] for command in commands]
          assert len(names) == len(set(names)), "Duplicate slash command names discovered"
          print(f"Command registry OK: {len(commands)} commands")
          PY
